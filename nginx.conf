server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # robots.txt → text/plain
  location = /robots.txt {
    types { }
    default_type text/plain;
    add_header X-Debug-Loc "robots" always;   
    try_files /robots.txt =404;
  }

  # sitemap.xml ตัวหลัก → application/xml
  location = /sitemap.xml {
    types { }
    default_type application/xml; # หรือ text/xml ก็ได้
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=600" always;
  }

  # ไฟล์ sitemap อื่น ๆ (เช่น sitemap-1.xml, sitemap-index.xml)
  location ~ ^/sitemap.*\.xml$ {
    types { }
    default_type application/xml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=600" always;
  }

  # health check
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # assets
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|map)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ✅ ใช้ 200.html เป็น fallback สำหรับ Nuxt generate
  location / {
    try_files $uri /200.html;
  }
}
