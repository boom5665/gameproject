name: Build & Push Docker on tag

on:
  push:
    tags: ['poc-*', 'uat-*', 'prod-*']

env:
  IMAGE_REPO: ghcr.io/boom5665/gameproject

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: t
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ✅ เลือกค่า URL/ENV จาก Repository Variables ตาม prefix ของ tag
      - name: Set build env from variables
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          if [[ "$TAG" == prod-* ]]; then
            echo "NUXT_PUBLIC_SITE_ENV=prod" >> $GITHUB_ENV
            echo "NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ vars.BASE_URL }}" >> $GITHUB_ENV
          elif [[ "$TAG" == uat-* ]]; then
            echo "NUXT_PUBLIC_SITE_ENV=uat" >> $GITHUB_ENV
            echo "NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ vars.BASE_URL }}" >> $GITHUB_ENV
          else
            echo "NUXT_PUBLIC_SITE_ENV=poc" >> $GITHUB_ENV
            echo "NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}" >> $GITHUB_ENV
            echo "BASE_URL=${{ vars.BASE_URL }}" >> $GITHUB_ENV
          fi
          echo "Using: $NUXT_PUBLIC_SITE_ENV $NUXT_PUBLIC_SITE_URL $BASE_URL"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: boom5665
          password: ${{ secrets.GHCR_TOKEN }}

      # ✅ ส่งค่าเป็น build-args เพื่อให้ npm run generate ฝังค่าให้ถูกต้อง
      - name: Build & Push
        run: |
          IMAGE="${{ env.IMAGE_REPO }}"
          TAG="${{ steps.t.outputs.tag }}"
          docker build \
            --build-arg NUXT_PUBLIC_SITE_URL="$NUXT_PUBLIC_SITE_URL" \
            --build-arg NUXT_PUBLIC_SITE_ENV="$NUXT_PUBLIC_SITE_ENV" \
            --build-arg BASE_URL="$BASE_URL" \
            -t "$IMAGE:$TAG" .
          # (ออปชัน) ตรวจสอบ robots.txt ที่ build เสร็จแล้วก่อน push
          docker run --rm --entrypoint cat "$IMAGE:$TAG" /usr/share/nginx/html/robots.txt
          docker push "$IMAGE:$TAG"
          echo "✅ Pushed: $IMAGE:$TAG"
